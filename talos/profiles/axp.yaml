disks:
  SYSTEM:
    device: /dev/nvme0n1
  EPHEMERAL:
    device: /dev/nvme0n1
    size: 200GiB
  linstor:
    device: /dev/nvme0n1
    size: 1600GiB
imageConfig:
  filename: metal-amd64.iso
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/drbd
          - siderolabs/nvidia-container-toolkit-lts
          - siderolabs/nvidia-open-gpu-kernel-modules-lts
# renovate-pinned: depName=talos-installer reason=cluster upgrades are performed manually with talosctl
image: factory.talos.dev/metal-installer/79770bff8ecabad8e2f0bc8ef58f121a41af55e31e4e4ec2b3b0d1d00b10cb1d:v1.14.4
machineConfig:
  machine:
    kernel:
      modules:
        - name: nvidia
        - name: nvidia_uvm
        - name: nvidia_drm
        - name: nvidia_modeset

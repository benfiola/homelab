bgpControlPlane:
  enabled: true
bpf:
  masquerade: true
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
clustermesh:
  policyDefaultLocalCluster: true
cni:
  exclusive: false
hostFirewall:
  enabled: true
hubble:
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
  relay:
    enabled: true
    podSecurityContext:
      fsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add: []
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: Issuer
        name: ca
  ui:
    enabled: true
    backend:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add: []
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    frontend:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add: []
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    securityContext:
      fsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
ipam:
  mode: kubernetes
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
labels: kubernetes\.io/hostname k8s-app app node-role\.kubernetes\.io/control-plane gateway\.envoyproxy\.io/owning-gateway-name
loadBalancer:
  mode: dsr
  dsrDispatch: geneve
nodeLabels: io\.cilium\.k8s\.policy\.cluster node-role\.kubernetes\.io/control-plane kubernetes\.io/hostname
nodeSelectorLabels: true
operator:
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  skipCRDCreation: true
policyAuditMode: false
policyEnforcementMode: always
rollOutCiliumPods: true
tunnelProtocol: geneve
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# these chart defaults are null, and the chart only renders them when the key exists. helm 3
# rendered them as empty values and helm 4 drops them. they are set explicitly so the rendered
# config (and the config checksum that rolls the agents) matches what is deployed; remove them,
# deliberately, to let cilium roll out the leaner config.
debug:
  verbose: ""
nodePort:
  addresses: []
policyCIDRMatchMode: []

reloader:
  autoReloadAll: true
  deployment:
    securityContext:
      fsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add: []
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
  reloadStrategy: annotations

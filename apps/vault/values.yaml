injector:
  enabled: false
server:
  audit:
    enabled: true
  auditStorage:
    enabled: true
    storageClass: standard
  dataStorage:
    storageClass: standard
  extraContainers:
    - env:
        - name: VAULT_UNSEAL_KEY
          value: /vault/data/unseal-key
      image: ghcr.io/benfiola/homelab-images/vault-unseal:1.0.2
      name: vault-unseal
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add: []
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      volumeMounts:
        - name: data
          mountPath: /vault/data
          readOnly: true
  ha:
    enabled: true
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

        disable_mlock = true
    replicas: 3
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add: []
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      pod:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
  updateStrategyType: RollingUpdate
ui:
  enabled: true

controller:
  kubeRbacProxy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits: null
  manager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits: null
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
hooks:
  upgradeCRDs:
    enabled: false

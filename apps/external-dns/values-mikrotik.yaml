annotationFilter: homelab.benfiola.com/use-external-dns-mikrotik
enableGatewayListenerSets: true
image:
  # renovate: datasource=docker depName=registry.k8s.io/external-dns/external-dns
  tag: v0.24.0
nameOverride: external-dns-mikrotik
policy: sync
provider:
  name: webhook
  webhook:
    env:
      - name: MIKROTIK_BASEURL
        value: http://router.fiola.dev
      - name: MIKROTIK_PASSWORD
        valueFrom:
          secretKeyRef:
            name: secrets
            key: routeros-password
      - name: MIKROTIK_USERNAME
        valueFrom:
          configMapKeyRef:
            name: config
            key: routeros-username
    image:
      repository: ghcr.io/mirceanton/external-dns-provider-mikrotik
      # renovate: datasource=docker depName=ghcr.io/mirceanton/external-dns-provider-mikrotik
      tag: v1.6.3
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
sources:
  - gateway-grpcroute
  - gateway-httproute
  - gateway-tcproute
  - gateway-tlsroute
  - gateway-udproute

backend:
  replicas: 0
deploymentMode: SingleBinary
gateway:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
loki:
  analytics:
    reporting_enabled: false
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: s3
    retention_enabled: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  ingester:
    chunk_encoding: snappy
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    volume_enabled: true
  pattern_ingester:
    enabled: true
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  querier:
    max_concurrent: 1
  schemaConfig:
    configs:
      - from: 2024-04-01
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13
        store: tsdb
  storage:
    bucketNames:
      admin: loki-admin
      chunks: loki-chunks
      ruler: loki-ruler
    type: s3
    s3:
      accessKeyId: ${S3_ACCESS_KEY_ID}
      endpoint: garage.garage.svc:3900
      insecure: true
      region: garage
      s3ForcePathStyle: true
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
lokiCanary:
  enabled: false
memcached:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
minio:
  enabled: false
resultsCache:
  resources:
    requests:
      memory: 128Mi
    limits: null
chunksCache:
  resources:
    requests:
      memory: 3072Mi
    limits: null
read:
  replicas: 0
singleBinary:
  extraArgs:
    - --config.expand-env=true
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: garage-key-garage-loki
          key: access-key-id
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: garage-key-garage-loki
          key: secret-access-key
  persistence:
    storageClass: standard
  replicas: 1
test:
  enabled: false
write:
  replicas: 0

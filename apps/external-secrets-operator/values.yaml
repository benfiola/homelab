bitwarden-sdk-server:
  enabled: true
  # the sdk's resolver fails external names under the default ndots of 5, which surfaces as a 400 on
  # login (see the server's README, 'DNS Issues')
  podDnsConfig:
    options:
      - name: ndots
        value: "2"
  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add: []
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
certController:
  podSecurityContext:
    fsGroup: 65534
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
podSecurityContext:
  fsGroup: 65534
resources:
  requests:
    cpu: 10m
    memory: 32Mi
securityContext:
  runAsUser: 65534
  runAsGroup: 65534
webhook:
  podSecurityContext:
    fsGroup: 65534
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534

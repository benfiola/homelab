# differences between the golden manifests (what is deployed) and the new render that are
# accepted on purpose. every entry needs a reason; an entry that stops matching is an error.
allow:
  - app: cilium
    object: apps/DaemonSet/cilium/cilium
    path: /spec/template/metadata/annotations/cilium.io~1cilium-configmap-checksum
    reason: >-
      helm hashes the rendered configmap template text. the rendered configmap is identical
      object-for-object, but the old pipeline's helm rendered the text slightly differently, so
      the hash changes and the agents do one rolling restart at cutover. not pinned to the old
      value, which would stop the annotation tracking future config changes.
  - app: cilium
    object: apps/DaemonSet/cilium/cilium
    path: /spec/template/spec/initContainers/0/command/2
    reason: >-
      the old pipeline's helm 3 rendered an empty `--k8s-api-server-urls=` argument, which does
      nothing; helm 4 does not render it. not restored: the agents restart at cutover anyway
      (see the configmap checksum above).
  - app: flux-bootstrap
    object: kustomize.toolkit.fluxcd.io/Kustomization/flux-system/flux-bootstrap
    reason: >-
      no longer an app. bootstrap creates this kustomization itself (the same object, see the
      flux-bootstrap stage of bootstrap.yaml). nothing in the cluster owns it, so not publishing
      it changes nothing there.

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.244.0.0/16
ingress:
  frigate:
    ui_mode: toolbar
    title: Cameras
    icon: mdi:cctv
    url: http://frigate.frigate.svc:5000
  preview:
    ui_mode: toolbar
    parent: frigate
    url: http://frigate.frigate.svc:5000
logger:
  default: info
lovelace:
  resource_mode: yaml
  dashboards:
    dashboard-thermostat:
      mode: yaml
      title: Thermostat
      icon: mdi:thermometer
      show_in_sidebar: true
      filename: dashboard-thermostat.yaml
    dashboard-lights:
      mode: yaml
      title: Lights
      icon: mdi:lightbulb-on
      show_in_sidebar: true
      filename: dashboard-lights.yaml
mobile_app: {}
zeroconf: {}
automation: !include automations.yaml
script: !include scripts.yaml

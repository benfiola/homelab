toggle_scene:
  alias: Toggle scene
  fields:
    zone_entity:
      description: The light entity representing the zone/group
      example: light.living_room_zone
      selector:
        entity:
          domain: light
    scene_entity:
      description: The scene to activate when the zone is off
      example: scene.living_room_evening
      selector:
        entity:
          domain: scene
  sequence:
    - if:
        - condition: template
          value_template: "{{ is_state(zone_entity, 'off') }}"
      then:
        - action: scene.turn_on
          target:
            entity_id: "{{ scene_entity }}"
      else:
        - action: light.turn_off
          target:
            entity_id: "{{ zone_entity }}"

bedroom_2_lights_on:
  alias: Bedroom 2 lights on
  description: >-
    Turns the bedroom 2 lights on at a warm, normal brightness. Use for
    requests like "turn on the lights", "brighten the room", or
    "lights on".
  sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.bedroom_2_bedroom_2_warm

bedroom_2_lights_dim:
  alias: Bedroom 2 lights dim
  description: >-
    Dims the bedroom 2 lights to a low, warm, relaxing level. Use for requests
    like "dim the lights", "make the bedroom cozy", or "turn the
    lights down low".
  sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.bedroom_2_bedroom_2_warm_dim

bedroom_2_lights_off:
  alias: Bedroom 2 lights off
  description: >-
    Turns off all bedroom 2 lights. Use for requests like "turn off the
    lights" or "lights off".
  sequence:
    - action: light.turn_off
      target:
        device_id: 3565c55584a0ddc92b4a137ac64230a3

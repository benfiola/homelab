# first-boot order for a new cluster: `just bootstrap`, once talos is up and the kubeconfig is in place.
# once flux is running, everything else converges by retry.
#
# apply:           kubectl apply out/apps/<name>/manifest.yaml for each app
# kustomizations:  create flux Kustomizations (a name, and a path of the manifests repository)
# run:             commands to run; `retry` is a timeout in seconds, `requires` lists required
#                  environment variables
#
# ${VAR} and ${VAR:-default} in commands are expanded from the environment:
# FLUX_BRANCH=scratch just bootstrap
#
# the external-secrets stage can be run alone, to give the cluster a new token for bitwarden:
# just bootstrap --only external-secrets
stages:
  - name: cluster-ready
    run:
      - command: [kubectl, cluster-info]
        retry: 900

  - name: crds
    apply: [crds]
    serverSide: true
    forceConflicts: true
    run:
      - command:
          [kubectl, wait, --for=condition=Established, crd, --all, --timeout=5m]

  - name: network-policy
    apply: [network-policy]

  - name: cilium
    apply: [cilium]
    run:
      - command:
          [
            kubectl,
            --namespace=cilium,
            rollout,
            status,
            daemonset/cilium,
            --timeout=60s,
          ]
        retry: 900

  - name: flux
    run:
      - command:
          - flux
          - bootstrap
          - github
          - --owner=${FLUX_OWNER:-benfiola}
          - --personal
          - --repository=${FLUX_REPOSITORY:-homelab-manifests}
          - --branch=${FLUX_BRANCH:-main}
          - --network-policy=false
          - --path=./flux
        requires: [FLUX_GIT_TOKEN]

  # bootstrap flux via an app-of-apps
  - name: flux-bootstrap
    kustomizations:
      - name: flux-bootstrap
        path: ./apps/flux

  # wait for external-secrets-operator to come online, then bootstrap external-secrets-operator with a Bitwarden token
  - name: external-secrets
    run:
      - command:
          - kubectl
          - wait
          - --for=jsonpath={.status.phase}=Active
          - namespace/external-secrets-operator
          - --timeout=60s
        retry: 900
      - command:
          - bash
          - -euo
          - pipefail
          - -c
          - |
            if [ -n "${ESO_BWS_TOKEN-}" ]; then
              token="$ESO_BWS_TOKEN"
            else
              file="$HOME/.homelab/eso-bws-token"
              [ "$(stat -c %a "$file")" = 600 ] || { echo "$file must be readable by its owner only (chmod 600 $file)" >&2; exit 1; }
              token="$(tr -d '\n' < "$file")"
            fi
            kubectl create secret generic bitwarden-credentials \
              --namespace=external-secrets-operator \
              --from-file=token=<(printf %s "$token") \
              --dry-run=client --output=yaml | kubectl apply --filename=-

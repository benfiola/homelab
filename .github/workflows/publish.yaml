name: publish

# renders apps/ and publishes the result to the apps folder of the homelab-manifests repository,
# which flux reads. nothing else in that repository is touched.

on:
  push:
    branches:
      - main

env:
  MANIFESTS_REPOSITORY: benfiola/homelab-manifests
  MANIFESTS_BRANCH: main
  MANIFESTS_FOLDER: apps

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: "${{github.workflow}}"
    permissions:
      contents: read
    environment:
      name: publish
    defaults:
      run:
        # every step runs in the dev shell, wherever it runs (the path is absolute for steps that
        # change directory)
        shell: nix develop ${{github.workspace}} --command bash -euo pipefail {0}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: install nix
        uses: cachix/install-nix-action@v31
      - name: install project
        run: just install
      - name: check
        run: just check
      - name: build manifests
        run: just build --out out
      - name: checkout manifests
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          repository: ${{env.MANIFESTS_REPOSITORY}}
          ref: ${{env.MANIFESTS_BRANCH}}
          path: homelab-manifests
          token: ${{secrets.HOMELAB_MANIFESTS_GIT_TOKEN}}
      - name: replace manifests
        run: |
          # an empty folder would be the whole repository
          rm -rf "homelab-manifests/${MANIFESTS_FOLDER:?}"
          cp -R out/apps "homelab-manifests/${MANIFESTS_FOLDER}"
      - name: commit manifests
        working-directory: homelab-manifests
        env:
          MESSAGE: ${{github.event.head_commit.message}}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # only the folder is ours: nothing else in the repository is staged
          git add -A -- "${MANIFESTS_FOLDER:?}"
          if git diff --cached --quiet; then
            echo "manifests are unchanged"
            exit 0
          fi
          git commit -m "${MESSAGE}"
          git push origin "HEAD:${MANIFESTS_BRANCH}"
